spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/tamtoc}
    username: ${DB_USER:tamtoc}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  error:
    include-message: never
game:
  jwt-secret: ${JWT_SECRET}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  tick-ms: 50
  broadcast-ms: 100
  input-timeout-ms: 250
